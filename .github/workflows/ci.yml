name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # ← было 3.10
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: cd core && uv sync
      - run: cd core && uv run ruff check src tests
      - run: cd core && uv run mypy src
      - run: cd core && uv run lint-imports
      - run: cd core && uv run pytest -v
